name: Update Strategy Lab
on:
  push:
    paths:
      - "scripts/build_strategies.py"
      - "data/factor_universe.csv"
      - ".github/workflows/strategies.yml"
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy
      - run: python scripts/build_strategies.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/strategies.json
          git diff --cached --quiet || git commit -m "Update Strategy Lab data"
          git pull --rebase origin main
          git push
