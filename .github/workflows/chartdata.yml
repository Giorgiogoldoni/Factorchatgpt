name: Update Factor Chart OHLC
on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'
    - cron: '0 22 * * *'
  push:
    paths:
      - "scripts/build_chartdata.py"
      - "data/factor_universe.csv"
      - ".github/workflows/chartdata.yml"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy
      - run: python -m py_compile scripts/build_chartdata.py
      - run: python scripts/build_chartdata.py
      - name: Validate OHLC feed
        run: python -c "import json; d=json.load(open('data/chartdata.json')); a=next(x for x in d['assets'] if x['ticker']=='IWMO.MI'); assert len(a['rows'])>=200; assert {'rsi14','macd','macdSignal','macdHist','atr14','bbUpper','bbLower'} <= set(d['columns']); print('Feed valid; IWMO bars:',len(a['rows']))"
      - name: Commit OHLC data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/chartdata.json
          git diff --cached --quiet || git commit -m "Update technical chart OHLC data"
          git pull --rebase origin main
          git push
