name: Update Factor RRG
on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * 1-5"
  push:
    paths:
      - "scripts/build_rrg.py"
      - "data/factor_universe.csv"
      - ".github/workflows/rrg.yml"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install yfinance pandas numpy
      - name: Build weekly RRG data
        run: python scripts/build_rrg.py
      - name: Commit updated RRG data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rrg.json
          git diff --cached --quiet || git commit -m "Update weekly RRG data"
          git pull --rebase origin main
          git push
